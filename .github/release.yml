changelog:
    exclude:
        labels:
            - skip-changelog
    categories:
        - title: Breaking changes
          labels:
              - breaking
        - title: New features
          labels:
              - enhancement
        - title: Bug fixes
          labels:
              - bug
        - title: Documentation
          labels:
              - documentation
        - title: Maintenance
          labels:
              - maintenance
        - title: Other changes
          labels:
              - "*"
