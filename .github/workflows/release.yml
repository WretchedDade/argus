name: Release

# Push a tag like v0.1.0 that matches the version in package.json.
on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
    contents: write

jobs:
    release:
        name: Build and publish release ZIP
        # Windows: the packaged node_modules include native Windows binaries.
        runs-on: windows-latest
        timeout-minutes: 20
        env:
            HUSKY: "0"
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - name: Check tag matches package version
              shell: pwsh
              run: |
                  $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  if ("v$version" -ne $env:GITHUB_REF_NAME) {
                      throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version"
                  }
            - name: Install dependencies and build
              run: npm ci
            - name: Check formatting
              run: npm run format:check
            - name: Check types
              run: npm run typecheck
            - name: Run tests
              run: npm test
            - name: Stage release
              run: node scripts/package-release.ts
            - name: Create ZIP
              shell: pwsh
              run: |
                  $name = "argus-$env:GITHUB_REF_NAME"
                  Move-Item "release/argus-$($env:GITHUB_REF_NAME.TrimStart('v'))" "release/$name"
                  Compress-Archive -Path "release/$name" -DestinationPath "release/$name-windows.zip"
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: >
                  gh release create $env:GITHUB_REF_NAME
                  "release/argus-$env:GITHUB_REF_NAME-windows.zip"
                  --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
