name: Release

# Runs when package.json changes on main. If the version has no tag yet,
# the workflow builds the ZIP and creates the tag and the release.
on:
    push:
        branches: [main]
        paths: [package.json]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    check:
        name: Check for a new version
        # Manual runs can pick any branch. Only main may release.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            needs_release: ${{ steps.version.outputs.needs_release }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Compare package.json version with existing tags
              id: version
              run: |
                  version=$(node -p "require('./package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  # Exit code 2 means the lookup worked and found no matching tag.
                  # Any other failure stops the job instead of enabling a release.
                  status=0
                  git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
                  if [ "$status" -eq 0 ]; then
                      echo "Tag v$version already exists. Nothing to release."
                      echo "needs_release=false" >> "$GITHUB_OUTPUT"
                  elif [ "$status" -eq 2 ]; then
                      echo "needs_release=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Tag lookup failed with exit code $status."
                      exit "$status"
                  fi

    release:
        name: Build and publish release ZIP
        needs: check
        if: needs.check.outputs.needs_release == 'true'
        # One publisher per version. A queued run waits and never cancels the active one.
        concurrency:
            group: release-${{ needs.check.outputs.version }}
            cancel-in-progress: false
        # Windows: the packaged node_modules include native Windows binaries.
        runs-on: windows-latest
        timeout-minutes: 20
        env:
            HUSKY: "0"
            TAG: v${{ needs.check.outputs.version }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - name: Install dependencies and build
              run: npm ci
            - name: Check formatting
              run: npm run format:check
            - name: Check types
              run: npm run typecheck
            - name: Run tests
              run: npm test
            - name: Stage release
              run: node scripts/package-release.ts
            - name: Create ZIP
              shell: pwsh
              run: |
                  $name = "argus-$env:TAG"
                  Move-Item "release/argus-$($env:TAG.TrimStart('v'))" "release/$name"
                  Compress-Archive -Path "release/$name" -DestinationPath "release/$name-windows.zip"
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: |
                  git ls-remote --exit-code --tags origin "refs/tags/$env:TAG" | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                      # A tag without its uploaded ZIP is a failed release, not a finished one.
                      $assets = gh release view $env:TAG --json assets --jq '.assets[] | select(.name == "argus-' + $env:TAG + '-windows.zip" and .state == "uploaded") | .name'
                      if ($LASTEXITCODE -ne 0 -or -not $assets) {
                          throw "Tag $env:TAG exists, but the release ZIP is missing. Delete the tag and release, then run again."
                      }
                      Write-Host "Tag $env:TAG already has its release ZIP. Nothing to release."
                      exit 0
                  }
                  if ($LASTEXITCODE -ne 2) { throw "Tag lookup failed with exit code $LASTEXITCODE" }
                  gh release create $env:TAG "release/argus-$env:TAG-windows.zip" --title $env:TAG --generate-notes --target $env:GITHUB_SHA
                  if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
