name: Release

# Runs when package.json changes on main. If the version has no tag yet and is
# a minor or major version (patch = 0), the workflow builds the ZIP and creates
# the tag and the release. A daily scheduled run also releases the current
# version (patch included) when it has no tag yet. Patches release on push
# only through the daily run or a manual run.
on:
    push:
        branches: [main]
        paths: [package.json]
    schedule:
        - cron: "0 22 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    check:
        name: Check for a new version
        # Manual runs can pick any branch. Only main may release.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            needs_release: ${{ steps.version.outputs.needs_release }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Compare package.json version with existing tags
              id: version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  # Patch versions (X.Y.Z with Z > 0) do not release on push. The daily run and a manual run can release one.
                  core="${version%%[-+]*}"
                  patch="${core##*.}"
                  if [ "$patch" != "0" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
                      echo "Version $version is a patch. It releases in the daily run."
                      echo "needs_release=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Exit code 2 means the lookup worked and found no matching tag.
                  # Any other failure stops the job instead of enabling a release.
                  status=0
                  git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
                  if [ "$status" -eq 0 ]; then
                      # A tag without its uploaded ZIP and checksum is a failed release, not a finished one.
                      # Clients need both assets, so a release with only the ZIP is never offered.
                      for asset in "argus-v$version-windows.zip" "argus-v$version-windows.zip.sha256"; do
                          uploaded=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$asset\" and .state == \"uploaded\") | .name")
                          if [ -z "$uploaded" ]; then
                              echo "Tag v$version exists, but the release asset $asset is missing. Delete the tag and release, then run again."
                              exit 1
                          fi
                      done
                      echo "Tag v$version already has its release ZIP and checksum. Nothing to release."
                      echo "needs_release=false" >> "$GITHUB_OUTPUT"
                  elif [ "$status" -eq 2 ]; then
                      echo "needs_release=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "Tag lookup failed with exit code $status."
                      exit "$status"
                  fi

    release:
        name: Build and publish release ZIP
        needs: check
        if: needs.check.outputs.needs_release == 'true'
        # One publisher per version. A queued run waits and never cancels the active one.
        concurrency:
            group: release-${{ needs.check.outputs.version }}
            cancel-in-progress: false
        # Windows: the packaged node_modules include native Windows binaries.
        runs-on: windows-latest
        timeout-minutes: 20
        env:
            HUSKY: "0"
            TAG: v${{ needs.check.outputs.version }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Check formatting
              run: npm run format:check
            - name: Check types
              run: npm run typecheck
            - name: Run tests
              run: npm test
            - name: Stage release
              run: node scripts/package-release.ts
            - name: Verify staged runtime without signing in
              shell: pwsh
              run: |
                  $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  node scripts/verify-release.ts "release/argus-$version"
                  if ($LASTEXITCODE -ne 0) { throw "Staged runtime verification failed" }
            - name: Create ZIP
              shell: pwsh
              run: |
                  $name = "argus-$env:TAG"
                  Move-Item "release/argus-$($env:TAG.TrimStart('v'))" "release/$name"
                  Compress-Archive -Path "release/$name" -DestinationPath "release/$name-windows.zip"
            - name: Create checksum
              shell: pwsh
              run: |
                  $zip = "release/argus-$env:TAG-windows.zip"
                  $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
                  "$hash  argus-$env:TAG-windows.zip" | Set-Content -Encoding ascii "$zip.sha256"
            - name: Verify clean ZIP acquisition
              shell: pwsh
              run: |
                  $dest = Join-Path $env:RUNNER_TEMP "argus-verify-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
                  Expand-Archive "release/argus-$env:TAG-windows.zip" $dest
                  node scripts/verify-release.ts "$dest/argus-$env:TAG"
                  if ($LASTEXITCODE -ne 0) { throw "Acquired ZIP verification failed" }
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: |
                  git ls-remote --exit-code --tags origin "refs/tags/$env:TAG" | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "Tag $env:TAG already exists. Nothing to release."
                      exit 0
                  }
                  if ($LASTEXITCODE -ne 2) { throw "Tag lookup failed with exit code $LASTEXITCODE" }
                  gh release create $env:TAG "release/argus-$env:TAG-windows.zip" "release/argus-$env:TAG-windows.zip.sha256" --title $env:TAG --generate-notes --target $env:GITHUB_SHA
                  if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
