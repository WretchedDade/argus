name: Release

# Runs when package.json changes on main. If the version has no tag yet,
# the workflow builds the ZIP and creates the tag and the release.
on:
    push:
        branches: [main]
        paths: [package.json]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    check:
        name: Check for a new version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            needs_release: ${{ steps.version.outputs.needs_release }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Compare package.json version with existing tags
              id: version
              run: |
                  version=$(node -p "require('./package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
                      echo "Tag v$version already exists. Nothing to release."
                      echo "needs_release=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "needs_release=true" >> "$GITHUB_OUTPUT"
                  fi

    release:
        name: Build and publish release ZIP
        needs: check
        if: needs.check.outputs.needs_release == 'true'
        # Windows: the packaged node_modules include native Windows binaries.
        runs-on: windows-latest
        timeout-minutes: 20
        env:
            HUSKY: "0"
            TAG: v${{ needs.check.outputs.version }}
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
            - name: Install dependencies and build
              run: npm ci
            - name: Check formatting
              run: npm run format:check
            - name: Check types
              run: npm run typecheck
            - name: Run tests
              run: npm test
            - name: Stage release
              run: node scripts/package-release.ts
            - name: Create ZIP
              shell: pwsh
              run: |
                  $name = "argus-$env:TAG"
                  Move-Item "release/argus-$($env:TAG.TrimStart('v'))" "release/$name"
                  Compress-Archive -Path "release/$name" -DestinationPath "release/$name-windows.zip"
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: pwsh
              run: >
                  gh release create $env:TAG
                  "release/argus-$env:TAG-windows.zip"
                  --title $env:TAG --generate-notes --target $env:GITHUB_SHA
